# ---------------------------------------------------------------------------
# FORK-ONLY WORKFLOW: not part of upstream finos/legend-shared.
#
# Why this exists:
#   Upstream's build.yml is guarded with
#     if: github.repository == 'finos/legend-shared'
#   so it never runs on forks. That leaves PRs on this fork with no build/test
#   signal. This workflow restores one, without touching any upstream file.
#
# What it does:
#   - Runs on pushes to master, on every PR, and on demand.
#   - Builds and runs the full test suite (`mvn verify`) on JDK 17 and JDK 25.
#     JDK 17 is the modernization target; JDK 25 is what upstream CI uses.
#   - Unlike upstream (which passes -Dmaven.test.failure.ignore=true), a failing
#     test FAILS this check, so a green check means the tests actually passed.
#   - Writes a short summary to the run page: test totals, the configured
#     Java release, and how many test files still use JUnit 4 vs JUnit 5.
# ---------------------------------------------------------------------------
name: Fork CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build + Test
        run: mvn -B -ntp verify -Dmaven.javadoc.skip=true

      - name: Summary
        if: always()
        run: |
          tests=0; failures=0; errors=0; skipped=0
          for f in $(find . -path '*/target/surefire-reports/TEST-*.xml'); do
            hdr=$(grep -m1 -o '<testsuite [^>]*>' "$f" || true)
            attr() { echo "$hdr" | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]\+' || echo 0; }
            tests=$((tests + $(attr tests)));       failures=$((failures + $(attr failures)))
            errors=$((errors + $(attr errors)));    skipped=$((skipped + $(attr skipped)))
          done
          # `|| true` because the default shell uses pipefail and grep exits 1 on zero matches
          release=$( (grep -m1 -o '<maven.compiler.release>[^<]*' pom.xml || true) | sed 's/.*>//')
          junit4=$( (grep -rl --include='*.java' 'import org.junit.Test;' . || true) | wc -l)
          junit5=$( (grep -rl --include='*.java' 'import org.junit.jupiter' . || true) | wc -l)
          {
            echo "### Fork CI: JDK ${{ matrix.java }}"
            echo "| Tests run | Failures | Errors | Skipped | Java release | JUnit 4 test files | JUnit 5 test files |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $tests | $failures | $errors | $skipped | $release | $junit4 | $junit5 |"
          } >> "$GITHUB_STEP_SUMMARY"
